<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Healthetc.life | Official Website</title>
    <meta name="description" content="Official website for Healthetc.life. Visit for health and wellness products and information." />
    <style>
      :root {
        --bg: #f7faf8;
        --card: #ffffff;
        --primary: #1f7a5d;
        --primary-dark: #155c45;
        --text: #1f2937;
        --muted: #6b7280;
        --border: #e5e7eb;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
      }
      .container {
        max-width: 900px;
        margin: 60px auto;
        padding: 24px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        padding: 32px;
      }
      h1 {
        margin-top: 0;
        color: var(--primary-dark);
        font-size: clamp(2rem, 4vw, 3rem);
      }
      p { color: var(--text); }
      .link-btn {
        display: inline-block;
        margin-top: 18px;
        background: var(--primary);
        color: white;
        text-decoration: none;
        padding: 14px 22px;
        border-radius: 10px;
        font-weight: 700;
        transition: background 0.2s ease;
      }
      .link-btn:hover {
        background: var(--primary-dark);
      }
      .meta {
        color: var(--muted);
        font-size: 0.95rem;
        margin-top: 14px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <h1>Healthetc.life</h1>
        <p>
          Discover health and wellness products, ingredients, and research-driven solutions at
          Healthetc.life.
        </p>
        <a class="link-btn" href="https://healthetc.life/" target="_blank" rel="noopener noreferrer">
          Visit Healthetc.life
        </a>
        <div class="meta">Official website backlink page</div>
      </div>
    </div>
  </body>
</html>
